name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - run: npx tauri build --no-bundle
      - name: Portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/Trix Ultra" | Out-Null
          Copy-Item src-tauri/target/release/trix-ultra.exe "dist/Trix Ultra/Trix Ultra.exe"
          Compress-Archive -Path "dist/Trix Ultra" -DestinationPath dist/Trix-Ultra-Windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/Trix-Ultra-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component clippy --target aarch64-apple-darwin --target x86_64-apple-darwin
      - run: npm ci
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - run: scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/Trix-Ultra-macOS.zip

  # A new version with its CHANGELOG heading becomes a release; the README's download links follow the latest.
  release:
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if gh release view "v$version" > /dev/null 2>&1; then echo "v$version is out"; exit 0; fi
          # Notes: the lines under «## <version>» or «## [<version>]»; without that heading, no release
          if ! awk -v v="$version" '/^## / { t = substr($0, 4); sub(/^\[/, "", t); sub(/[] ].*$/, "", t); f = (t == v); if (f) found = 1; next } f { print } END { exit !found }' CHANGELOG.md > notes.md; then
            echo "No CHANGELOG heading for $version"; exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --dir dist
          gh release create "v$version" dist/windows/Trix-Ultra-Windows.zip dist/macos/Trix-Ultra-macOS.zip \
            --title "Trix Ultra $version" --notes-file notes.md --target "$GITHUB_SHA"
