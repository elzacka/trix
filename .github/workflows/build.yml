name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - run: npx tauri build --no-bundle
      - name: Portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/Trix" | Out-Null
          Copy-Item src-tauri/target/release/trix.exe "dist/Trix/Trix.exe"
          Copy-Item BRUKERVEILEDNING.md "dist/Trix/BRUKERVEILEDNING.md"
          Compress-Archive -Path "dist/Trix" -DestinationPath dist/Trix-Windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/Trix-Windows.zip
      - name: Store package
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist/msix/Assets | Out-Null
          Copy-Item dist/Trix/* dist/msix
          npx tauri icon assets/icon.svg -o "$env:RUNNER_TEMP/icons"
          foreach ($logo in 'Square44x44Logo', 'Square150x150Logo', 'StoreLogo') { Copy-Item "$env:RUNNER_TEMP/icons/$logo.png" dist/msix/Assets }
          (Get-Content store/AppxManifest.xml -Raw).Replace('Version="0.0.0.0"', "Version=`"$version.0`"") | Set-Content dist/msix/AppxManifest.xml -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /d dist/msix /p dist/Trix.msix /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Store package starts, with the data folder outside the package
        shell: pwsh
        run: |
          # A copy that installs on the runner's Windows Server, an older build than the app requires; unsigned, so in developer mode
          Copy-Item dist/msix "$env:RUNNER_TEMP/msix" -Recurse
          $manifest = "$env:RUNNER_TEMP/msix/AppxManifest.xml"
          (Get-Content $manifest -Raw) -replace 'MinVersion="[^"]+"', "MinVersion=`"10.0.$([Environment]::OSVersion.Version.Build).0`"" | Set-Content $manifest -Encoding utf8
          reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f
          Add-AppxPackage -Register $manifest
          $package = Get-AppxPackage -Name ([xml](Get-Content $manifest -Raw)).Package.Identity.Name
          Start-Process explorer.exe "shell:AppsFolder\$($package.PackageFamilyName)!Trix"
          $setup = "$env:APPDATA\Trix\Oppsett.md"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $setup); $i++) { Start-Sleep 1 }
          $private = "$env:LOCALAPPDATA\Packages\$($package.PackageFamilyName)\LocalCache"
          if (-not (Test-Path $setup)) { Get-ChildItem -Recurse $private -ErrorAction SilentlyContinue | Select-Object -First 20 FullName; throw "No $setup" }
          if (Test-Path "$private\Roaming\Trix") { throw "Files in $private\Roaming\Trix" }
          # A second start shows the panel: a screenshot for the Store listing
          Start-Process explorer.exe "shell:AppsFolder\$($package.PackageFamilyName)!Trix"
          Start-Sleep 5
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $image = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $image.Save("$PWD/dist/Trix-Store-screenshot.png")
          } catch { Write-Warning "No screenshot: $_" }
          Stop-Process -Name Trix
          Remove-AppxPackage $package.PackageFullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store
          path: |
            dist/Trix.msix
            dist/Trix-Store-screenshot.png

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component clippy --target aarch64-apple-darwin --target x86_64-apple-darwin
      - run: npm ci
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - run: scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unsigned
          path: dist/Trix-macOS.dmg

  # A job of its own: no build code runs while the Developer ID is in a keychain
  sign:
    needs: macos
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    # Notarization takes 1-2 min; a hung one ran 6 h until GitHub's default cut it
    timeout-minutes: 30
    # Its secrets reach only this job, and only on main (the environment's branch policy)
    environment: signing
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh run download "$GITHUB_RUN_ID" --name macos-unsigned --dir built
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Signing keychain
        id: signing
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CERTIFICATE" ]; then echo "No signing secrets: ad hoc"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials trix --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Sign and notarize
        run: |
          hdiutil attach -readonly -nobrowse -mountpoint built/image built/Trix-macOS.dmg
          ditto "built/image/Trix.app" "built/Trix.app"
          hdiutil detach built/image
          scripts/sign.sh "built/Trix.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/Trix-macOS.dmg

  # A new version with its CHANGELOG heading becomes a release; the user guide's download links follow the latest.
  release:
    needs: [windows, sign]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIGNED: ${{ needs.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if gh release view "v$version" > /dev/null 2>&1; then echo "v$version is out"; exit 0; fi
          # Notes: the lines under «## <version>» or «## [<version>]»; without that heading, no release
          if ! awk -v v="$version" '/^## / { t = substr($0, 4); sub(/^\[/, "", t); sub(/[] ].*$/, "", t); f = (t == v); if (f) found = 1; next } f { print } END { exit !found }' CHANGELOG.md > notes.md; then
            echo "No CHANGELOG heading for $version"; exit 0
          fi
          if [ "$SIGNED" != true ]; then echo "macOS build is not signed: add the APPLE_* secrets (README, Develop)"; exit 1; fi
          # SAST: CodeQL (default setup) done on this commit, and no open high or critical alert
          for _ in $(seq 40); do
            state=$(gh run list --commit "$GITHUB_SHA" --json workflowName,status,conclusion --jq '[.[] | select(.workflowName == "CodeQL")][0] // {status: "not started"} | "\(.status) \(.conclusion // "")"')
            case "$state" in completed*) break ;; esac
            sleep 30
          done
          if [ "$state" != "completed success" ]; then echo "CodeQL on $GITHUB_SHA: $state"; exit 1; fi
          alerts=$(gh api --paginate "repos/$GH_REPO/code-scanning/alerts?state=open" --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | .html_url')
          if [ -n "$alerts" ]; then echo "Open CodeQL alerts: $alerts"; exit 1; fi
          gh run download "$GITHUB_RUN_ID" --dir dist
          gh api "repos/$GH_REPO/dependency-graph/sbom" --jq .sbom > dist/Trix-SBOM.spdx.json
          gh release create "v$version" dist/windows/Trix-Windows.zip dist/macos/Trix-macOS.dmg dist/Trix-SBOM.spdx.json \
            --title "Trix $version" --notes-file notes.md --target "$GITHUB_SHA"
