<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trix</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <img src="icon.svg" alt="" class="logo">
    <div class="tabs" role="tablist" aria-label="Lister">
      <button role="tab" id="tab-0" aria-controls="view" aria-selected="true">Hurtigtaster</button>
      <button role="tab" id="tab-1" aria-controls="view" aria-selected="false" tabindex="-1">Jukselapp</button>
    </div>
    <div class="menu-anchor">
      <button id="more" class="icon-button" aria-label="Flere valg" title="Flere valg" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/></svg>
      </button>
      <div id="menu" role="menu" hidden>
        <button role="menuitem" class="submenu-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="view-menu">Visning<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button>
        <div id="view-menu" class="submenu" role="menu" aria-label="Visning" hidden>
          <div id="sources" role="group">
            <button role="menuitemradio" data-view="mine" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>Mine hurtigtaster</button>
            <button role="menuitemradio" data-view="system" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg><span id="system-name"></span></button>
            <button role="menuitemradio" data-view="begge" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>Begge</button>
            <hr>
          </div>
          <button role="menuitemradio" data-order="az" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>Sorter A–Å</button>
          <button role="menuitemradio" data-order="file" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>Rekkefølgen i kildefila</button>
        </div>
        <button role="menuitem" class="submenu-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="source-menu"><span id="source-label"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button>
        <div id="source-menu" class="submenu" role="menu" aria-labelledby="source-label" hidden>
          <button role="menuitem" id="edit-file">Se og endre i fila</button>
          <button role="menuitem" id="export">Eksporter</button>
          <button role="menuitem" id="import">Importer …</button>
          <button role="menuitem" id="reveal-file">Åpne kildemappe</button>
        </div>
        <hr>
        <button role="menuitem" id="hotkey"></button>
        <hr>
        <button role="menuitem" id="quit">Avslutt Trix</button>
        <div role="menuitem" aria-disabled="true" id="version"></div>
      </div>
    </div>
  </header>

  <main id="view" role="tabpanel" aria-labelledby="tab-0">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>
      <input id="query" type="search" autocomplete="off" spellcheck="false" aria-label="Søk">
      <button id="clear" class="icon-button" aria-label="Tøm søk" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>
      </button>
      <button id="capture" class="icon-button" aria-label="Slå opp hurtigtast" title="Slå opp hurtigtast" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8a2 2 0 0 1 2 -2h16a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-16a2 2 0 0 1 -2 -2l0 -8"/><path d="M6 10l0 .01"/><path d="M10 10l0 .01"/><path d="M14 10l0 .01"/><path d="M18 10l0 .01"/><path d="M6 14l0 .01"/><path d="M18 14l0 .01"/><path d="M10 14l4 .01"/></svg>
      </button>
    </div>
    <p id="error" role="alert" hidden></p>
    <div id="tools"></div>
    <p id="status" class="sr-only" aria-live="polite"></p>
    <div id="list"></div>
  </main>

  <section id="editor" hidden aria-labelledby="editor-title">
    <div class="editor-bar">
      <h1 id="editor-title"></h1>
      <button id="cancel" class="button">Avbryt</button>
      <button id="save" class="button primary">Lagre</button>
    </div>
    <p id="editor-error" role="alert" hidden></p>
    <textarea id="text" spellcheck="false" aria-labelledby="editor-title"></textarea>
  </section>

  <input id="import-file" type="file" accept=".md,.markdown,.txt" hidden>
  <dialog id="import-dialog" aria-labelledby="import-question">
    <form method="dialog">
      <p id="import-question">Vil du slå fila sammen med lista di eller erstatte lista?</p>
      <div class="dialog-buttons">
        <button class="button" value="cancel">Avbryt</button>
        <button class="button" value="replace">Erstatt</button>
        <button class="button primary" value="merge" autofocus>Slå sammen</button>
      </div>
    </form>
  </dialog>
</body>
</html>
